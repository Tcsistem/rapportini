<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importa Servizi GeoBadge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap');
body{font-family:'IBM Plex Sans',sans-serif;background:#f5f4f0;margin:0;padding:40px 20px;color:#1a1a18}
.box{max-width:520px;margin:0 auto;background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:32px}
h1{font-size:18px;margin:0 0 8px}
p{font-size:13px;color:#6b6a62;margin:0 0 20px;line-height:1.5}
.drop{border:2px dashed #cccbc2;border-radius:8px;padding:40px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:#1a1a18;background:#f0efe9}
.drop input{display:none}
.drop-label{font-size:13px;color:#6b6a62}
.filename{margin-top:14px;font-size:13px;font-weight:600;display:none}
.btn{width:100%;margin-top:20px;padding:12px;border:none;border-radius:6px;background:#1a1a18;color:#fff;font-size:14px;font-weight:500;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:16px;padding:12px 14px;border-radius:6px;font-size:13px;display:none}
.msg.ok{background:#e8f4e8;color:#2d6a2d;display:block}
.msg.err{background:#fae8e8;color:#7a1a1a;display:block}
</style>
</head>
<body>
<div class="box">
  <h1>📥 Importa Servizi da GeoBadge</h1>
  <p>Esporta il file CSV dei servizi da GeoBadge e caricalo qui per aggiornare l'elenco commesse/clienti usato nell'app rapportini.</p>

  <div class="drop" id="drop" onclick="document.getElementById('file').click()">
    <div class="drop-label">📄 Clicca o trascina qui il file CSV</div>
    <input type="file" id="file" accept=".csv">
    <div class="filename" id="filename"></div>
  </div>

  <button class="btn" id="btnImporta" onclick="importa()" disabled>Importa</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKHF52x6L9ZnZHxVq1iENY1koRe1ynG_4u_HLuFD8uCXPQhZbqRkDZa3Z7nqemvw_G/exec';
let csvContent = null;

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');

fileInput.addEventListener('change', function(e){ handleFile(e.target.files[0]); });
drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
drop.addEventListener('drop', function(e){
  e.preventDefault(); drop.classList.remove('over');
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file){
  if(!file) return;
  document.getElementById('filename').textContent = '✓ ' + file.name;
  document.getElementById('filename').style.display = 'block';
  var reader = new FileReader();
  reader.onload = function(e){
    csvContent = e.target.result;
    document.getElementById('btnImporta').disabled = false;
  };
  reader.readAsText(file, 'UTF-8');
}

async function importa(){
  if(!csvContent) return;
  var btn = document.getElementById('btnImporta');
  var msg = document.getElementById('msg');
  btn.disabled = true;
  btn.textContent = 'Importazione in corso...';
  msg.className = 'msg';

  try{
    var res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({_action: 'importaGbCsv', csv: csvContent})
    });
    var d = await res.json();
    if(d.ok){
      msg.className = 'msg ok';
      msg.textContent = '✓ Importati ' + d.count + ' servizi con successo!';
    } else {
      msg.className = 'msg err';
      msg.textContent = 'Errore: ' + (d.error || 'sconosciuto');
    }
  } catch(e){
    msg.className = 'msg err';
    msg.textContent = 'Errore di rete: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Importa';
  }
}
</script>
</body>
</html>
